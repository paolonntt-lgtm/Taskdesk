kind = "web"
previewPath = "/"
title = "Landing Page - Ticket Manager"
version = "1.0.0"
id = "artifacts/landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18150

[services.development]
run = "pnpm --filter @workspace/landing run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/landing", "run", "build"]

[services.production.run]
args = ["node", "artifacts/landing/server.mjs"]

[services.production.run.env]
PORT = "18150"
NODE_ENV = "production"

[services.production.health.startup]
path = "/healthz"

[services.env]
PORT = "18150"
BASE_PATH = "/"
