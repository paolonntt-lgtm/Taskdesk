kind = "web"
previewPath = "/app/"
title = "Sistema Ticketing Aziendale"
version = "1.0.0"
id = "artifacts/ticketing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/app/" ]
localPort = 25627

[services.development]
run = "pnpm --filter @workspace/ticketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ticketing", "run", "build" ]
publicDir = "artifacts/ticketing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25627"
BASE_PATH = "/app/"
