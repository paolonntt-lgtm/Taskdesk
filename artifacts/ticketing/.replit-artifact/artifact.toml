kind = "web"
previewPath = "/app/"
title = "Sistema Ticketing Aziendale"
version = "1.0.0"
id = "artifacts/ticketing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/app/" ]
localPort = 25627

[services.development]
run = "pnpm --filter @workspace/ticketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ticketing", "run", "build" ]

[services.production.run]
args = ["node", "artifacts/ticketing/server.mjs"]

[services.production.run.env]
PORT = "25627"
NODE_ENV = "production"
BASE_PATH = "/app/"

[services.env]
PORT = "25627"
BASE_PATH = "/app/"
