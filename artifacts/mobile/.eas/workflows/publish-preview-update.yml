name: Publish compatible preview updates

defaults:
  tools:
    pnpm: "10.26.1"

on:
  push:
    branches:
      - main
    paths:
      - artifacts/mobile/.eas/workflows/publish-preview-update.yml
      - artifacts/mobile/package.json
      - artifacts/mobile/app/**
      - artifacts/mobile/assets/**
      - "!artifacts/mobile/assets/images/icon.png"
      - artifacts/mobile/components/**
      - artifacts/mobile/constants/**
      - artifacts/mobile/contexts/**
      - artifacts/mobile/hooks/**
      - artifacts/mobile/i18n/**
      - artifacts/mobile/utils/**
      - artifacts/mobile/web/**
      - lib/api-client-react/**

jobs:
  fingerprint:
    name: Check the native runtime
    type: fingerprint
    environment: preview
    env:
      EXPO_PUBLIC_DOMAIN: www.taskdesk.it
    hooks:
      before_install_node_modules:
        - name: Verify pnpm 10.26.1
          run: |
            npm install --global pnpm@10.26.1
            pnpm --version
            test "$(pnpm --version)" = "10.26.1"

  get_preview_build:
    name: Find a matching preview APK
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      distribution: internal
      channel: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_ios_preview_build:
    name: Find a matching preview iOS build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      distribution: internal
      channel: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  publish_preview_update:
    name: Publish to the preview channel
    needs: [get_preview_build]
    if: ${{ needs.get_preview_build.outputs.build_id }}
    type: update
    environment: preview
    env:
      EXPO_PUBLIC_DOMAIN: www.taskdesk.it
    hooks:
      before_install_node_modules:
        - name: Verify pnpm 10.26.1
          run: |
            npm install --global pnpm@10.26.1
            pnpm --version
            test "$(pnpm --version)" = "10.26.1"
    params:
      channel: preview
      platform: android

  publish_ios_preview_update:
    name: Publish iOS to the preview channel
    needs: [get_ios_preview_build]
    if: ${{ needs.get_ios_preview_build.outputs.build_id }}
    type: update
    environment: preview
    env:
      EXPO_PUBLIC_DOMAIN: www.taskdesk.it
    hooks:
      before_install_node_modules:
        - name: Verify pnpm 10.26.1
          run: |
            npm install --global pnpm@10.26.1
            pnpm --version
            test "$(pnpm --version)" = "10.26.1"
    params:
      channel: preview
      platform: ios
