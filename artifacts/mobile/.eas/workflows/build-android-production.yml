name: Build Android production AAB

defaults:
  tools:
    node: "22"
    pnpm: "10.26.1"

on:
  push:
    branches:
      - main

jobs:
  build_android_production:
    name: Build Android production AAB
    type: build
    hooks:
      before_install_node_modules:
        - name: Verify pnpm 10.26.1
          run: |
            node --version
            test "$(node -p 'process.versions.node.split(".")[0]')" = "22"
            npm install --global pnpm@10.26.1
            pnpm --version
            test "$(pnpm --version)" = "10.26.1"
    params:
      platform: android
      profile: production
