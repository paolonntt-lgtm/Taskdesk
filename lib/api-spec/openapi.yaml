openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Internal Ticketing System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tickets
    description: Ticket management
  - name: comments
    description: Ticket comments
  - name: notes
    description: Internal notes
  - name: activity
    description: Activity logs
  - name: users
    description: User management
  - name: notifications
    description: Notifications
  - name: stats
    description: Statistics and reports
  - name: bot
    description: AI bot for ticket creation assistance
  - name: knowledgeArticles
    description: Knowledge base articles management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Deactivate a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: assignedTo
          in: query
          schema:
            type: integer
        - name: createdBy
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketWithDetails"

    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketBody"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketBody"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"

    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Ticket deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/comments:
    get:
      operationId: listTicketComments
      tags: [comments]
      summary: List comments for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentWithAuthor"

    post:
      operationId: addTicketComment
      tags: [comments]
      summary: Add a comment to a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentWithAuthor"

  /tickets/{id}/comments/{commentId}:
    patch:
      operationId: updateTicketComment
      tags: [comments]
      summary: Edit a comment (own author or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentBody"
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentWithAuthor"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteTicketComment
      tags: [comments]
      summary: Delete a comment (own author or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/comments/{commentId}/reactions:
    post:
      operationId: toggleCommentReaction
      tags: [comments]
      summary: Toggle an emoji reaction on a comment (add if absent, remove if present)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleReactionBody"
      responses:
        "200":
          description: Updated reaction list for the comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleReactionResponse"
        "400":
          description: Invalid emoji
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket or comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/attachments:
    get:
      operationId: listTicketAttachments
      tags: [comments]
      summary: List attachments for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"

    post:
      operationId: saveTicketAttachment
      tags: [comments]
      summary: Save attachment metadata after upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAttachmentBody"
      responses:
        "201":
          description: Attachment saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [comments]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /tickets/{id}/notes:
    get:
      operationId: listTicketNotes
      tags: [notes]
      summary: List internal notes for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of internal notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NoteWithAuthor"

    post:
      operationId: addTicketNote
      tags: [notes]
      summary: Add an internal note to a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteWithAuthor"

  /tickets/{id}/activity:
    get:
      operationId: listTicketActivity
      tags: [activity]
      summary: List activity log for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogWithUser"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/by-status:
    get:
      operationId: getStatsByStatus
      tags: [stats]
      summary: Get ticket counts grouped by status
      responses:
        "200":
          description: Stats by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatGroup"

  /stats/by-category:
    get:
      operationId: getStatsByCategory
      tags: [stats]
      summary: Get ticket counts grouped by category
      responses:
        "200":
          description: Stats by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatGroup"

  /stats/by-location:
    get:
      operationId: getStatsByLocation
      tags: [stats]
      summary: Get ticket counts grouped by location
      responses:
        "200":
          description: Stats by location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatGroup"

  /stats/by-priority:
    get:
      operationId: getStatsByPriority
      tags: [stats]
      summary: Get ticket counts grouped by priority
      responses:
        "200":
          description: Stats by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatGroup"

  /stats/by-assignee:
    get:
      operationId: getStatsByAssignee
      tags: [stats]
      summary: Get ticket counts grouped by assignee
      responses:
        "200":
          description: Stats by assignee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatGroupWithName"

  /stats/trend:
    get:
      operationId: getTicketTrend
      tags: [stats]
      summary: Get ticket creation trend over last 30 days
      responses:
        "200":
          description: Trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  /stats/recent-tickets:
    get:
      operationId: getRecentTickets
      tags: [stats]
      summary: Get recently created or updated tickets
      responses:
        "200":
          description: Recent tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketWithDetails"

  /stats/my-tickets:
    get:
      operationId: getMyTickets
      tags: [stats]
      summary: Get tickets assigned to or created by current user
      responses:
        "200":
          description: My tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketWithDetails"

  /stats/due-soon:
    get:
      operationId: getDueSoonTickets
      tags: [stats]
      summary: Get open tickets with a due date within the next 7 days (including overdue)
      responses:
        "200":
          description: Due soon tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketWithDetails"

  /bot/chat:
    post:
      operationId: botChat
      tags: [bot]
      summary: Send a message to the AI bot (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotChatRequest"
      responses:
        "200":
          description: Server-sent events stream of bot response chunks
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Unauthorized

  /knowledge-articles:
    get:
      operationId: listKnowledgeArticles
      tags: [knowledgeArticles]
      summary: List knowledge base articles for the organization (admin only)
      responses:
        "200":
          description: List of knowledge articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeArticle"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createKnowledgeArticle
      tags: [knowledgeArticles]
      summary: Create a knowledge base article (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeArticleInput"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeArticle"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /knowledge-articles/{id}:
    put:
      operationId: updateKnowledgeArticle
      tags: [knowledgeArticles]
      summary: Update a knowledge base article (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeArticleInput"
      responses:
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeArticle"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteKnowledgeArticle
      tags: [knowledgeArticles]
      summary: Delete a knowledge base article (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        mainLocation:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        isAvailable:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - isActive
        - isAvailable
        - createdAt

    CreateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        mainLocation:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: string
          nullable: true
      required:
        - name
        - email
        - password
        - role

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        mainLocation:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: string
          nullable: true
        isActive:
          type: boolean
        isAvailable:
          type: boolean

    Ticket:
      type: object
      properties:
        id:
          type: integer
        ticketNumber:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        resource:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [open, waiting, resolved, closed]
        createdBy:
          type: integer
        assignedTo:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        resolutionNote:
          type: string
          nullable: true
      required:
        - id
        - title
        - description
        - category
        - location
        - priority
        - status
        - createdBy
        - createdAt
        - updatedAt

    TicketWithDetails:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            creator:
              $ref: "#/components/schemas/User"
            assignee:
              $ref: "#/components/schemas/User"
              nullable: true
            commentCount:
