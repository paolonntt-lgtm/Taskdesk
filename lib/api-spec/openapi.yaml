openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Internal Ticketing System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tickets
    description: Ticket management
  - name: comments
    description: Ticket comments
  - name: notes
    description: Internal notes
  - name: activity
    description: Activity logs
  - name: checklists
    description: Ticket checklists
  - name: users
    description: User management
  - name: notifications
    description: Notifications
  - name: announcements
    description: Time-limited announcements for organization collaborators
  - name: dailyReports
    description: Daily team reports
  - name: stats
    description: Statistics and reports
  - name: bot
    description: AI bot for ticket creation assistance
  - name: knowledgeArticles
    description: Knowledge base articles management
  - name: clients
    description: Client management
  - name: clientNotes
    description: Client notes console
  - name: stickyNotes
    description: Global sticky notes
  - name: groups
    description: User groups management
  - name: appointments
    description: Calendar appointments
  - name: calendar
    description: Calendar aggregation
  - name: search
    description: Global search

paths:
  /stripe/addon-price:
    get:
      operationId: getStripeAddonPrice
      tags: [billing]
      summary: Get the additional-seat price for the current plan cadence
      responses:
        "200":
          description: Additional-seat price matching the active plan billing interval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeAddonPrice"
        "400":
          description: No active subscription or unsupported billing interval
        "401":
          description: Not authenticated
        "404":
          description: Additional-seat product or matching price is not configured
  /stripe/add-seats:
    post:
      operationId: setStripeAddonSeats
      tags: [billing]
      summary: Set the number of additional seats on the active subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeAddonSeatsInput"
      responses:
        "200":
          description: Updated additional-seat count and availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeAddonSeatsResponse"
        "400":
          description: Invalid quantity, plan limit, or unsupported subscription
        "401":
          description: Not authenticated
        "404":
          description: Additional-seat product or matching price is not configured
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Search tickets, clients and users
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Search results grouped by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups for the current organization
      responses:
        "200":
          description: List of groups with member count
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupWithMembers"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new group (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupWithMembers"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /groups/{id}/permissions:
    patch:
      operationId: updateGroupPermissions
      tags: [groups]
      summary: Update a group's permissions (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: string
                    enum: [change_status, assign_time_tracked_tickets, add_notes, edit_fixed_notes, edit_client_notes, delete_client_notes, manage_client_sections, edit_client_section_content, create_appointments, view_worked_hours]
      responses:
        "200":
          description: Group permissions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  permissions:
                    type: array
                    items:
                      type: string
                      enum: [change_status, assign_time_tracked_tickets, add_notes, edit_fixed_notes, edit_client_notes, delete_client_notes, manage_client_sections, edit_client_section_content, create_appointments, view_worked_hours]
        "400":
          description: Invalid permissions
        "403":
          description: Forbidden
        "404":
          description: Group not found

  /groups/{id}:
    put:
      operationId: updateGroup
      tags: [groups]
      summary: Rename a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupWithMembers"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /groups/{id}/members:
    post:
      operationId: addGroupMember
      tags: [groups]
      summary: Add a user to a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberInput"
      responses:
        "200":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeGroupMember
      tags: [groups]
      summary: Remove a user from a group (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberInput"
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [auth]
      summary: Complete onboarding by selecting business type (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessType]
              properties:
                businessType:
                  type: string
                  enum: [it_support, professional_studio, agency, other]
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  businessType:
                    type: string
                  categories:
                    type: array
                    items:
                      type: string
        "400":
          description: Invalid business type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/organization:
    get:
      operationId: getOrganizationSettings
      tags: [auth]
      summary: Get current organization name and business type
      responses:
        "200":
          description: Organization settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  businessType:
                    type: string
                    nullable: true
                  clientsEnabled:
                    type: boolean
                  workedTimeEnabled:
                    type: boolean
                  timeTrackingModuleEnabled:
                    type: boolean
    patch:
      operationId: updateOrganizationSettings
      tags: [auth]
      summary: Update organization name and/or business type (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 2
                businessType:
                  type: string
                  nullable: true
                clientsEnabled:
                  type: boolean
                workedTimeEnabled:
                  type: boolean
                timeTrackingModuleEnabled:
                  type: boolean
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  businessType:
                    type: string
                    nullable: true
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/permission-events:
    get:
      operationId: waitForPermissionChanges
      tags: [auth]
      summary: Wait for a permission change for the current user
      responses:
        "200":
          description: Effective permissions have changed and should be refreshed
          content:
            application/json:
              schema:
                type: object
                required: [type]
                properties:
                  type:
                    type: string
                    enum: [permissions_changed]
        "204":
          description: No permission change occurred before the wait timed out
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Deactivate a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List tickets with optional filters
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: assignedTo
          in: query
          schema:
            type: integer
        - name: createdBy
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: resource
          in: query
          schema:
            type: string
        - name: emailOrigin
          in: query
          schema:
            type: boolean
        - name: clientId
          in: query
          schema:
            type: integer
        - name: scheduled
          in: query
          schema:
            type: boolean
        - name: recurring
          in: query
          description: Return only source tickets with a recurrence rule; generated copies are not included.
          schema:
            type: boolean
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketWithDetails"

    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketBody"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update ticket fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketBody"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"

    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Ticket deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/time-sessions/{sessionId}:
    patch:
      operationId: correctTicketTimeSession
      tags: [tickets]
      summary: Correct a closed tracked session (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackedTimeSessionCorrection"
      responses:
        "204":
          description: Session corrected and collaborator notified
        "400":
          description: Invalid correction
        "403":
          description: Admin access required
        "404":
          description: Closed tracked session not found

  /tickets/{id}/time-session-edits:
    get:
      operationId: getTicketTimeSessionEdits
      tags: [tickets]
      summary: List time-session corrections for a tracked ticket (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Time-session correction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketTimeSessionEdit"
        "403":
          description: Admin access required
        "404":
          description: Tracked ticket not found

  /tickets/{id}/clone:
    post:
      operationId: cloneTicket
      tags: [tickets]
      summary: Clone a ticket with optional scheduled date (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloneTicketBody"
      responses:
        "201":
          description: Cloned ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/recurrence:
    patch:
      operationId: setTicketRecurrence
      tags: [tickets]
      summary: Set or update the recurrence rule for a ticket (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRecurrenceBody"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTicketRecurrence
      tags: [tickets]
      summary: Remove the recurrence rule from a ticket (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/comments:
    get:
      operationId: listTicketComments
      tags: [comments]
      summary: List comments for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentWithAuthor"

    post:
      operationId: addTicketComment
      tags: [comments]
      summary: Add a comment to a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentWithAuthor"

  /tickets/{id}/comments/{commentId}:
    patch:
      operationId: updateTicketComment
      tags: [comments]
      summary: Edit a comment (own author or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentBody"
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentWithAuthor"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteTicketComment
      tags: [comments]
      summary: Delete a comment (own author or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Comment deleted
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/comments/{commentId}/reactions:
    post:
      operationId: toggleCommentReaction
      tags: [comments]
      summary: Toggle an emoji reaction on a comment (add if absent, remove if present)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleReactionBody"
      responses:
        "200":
          description: Updated reaction list for the comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleReactionResponse"
        "400":
          description: Invalid emoji
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket or comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/{id}/attachments:
