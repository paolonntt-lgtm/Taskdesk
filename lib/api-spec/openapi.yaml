components:
  schemas:
    StripeAddonPrice:
      type: object
      required: [priceId, unitAmount, currency, interval]
      properties:
        priceId:
          type: string
        unitAmount:
          type: integer
        currency:
          type: string
          enum: [eur]
        interval:
          type: string
          enum: [month, year]
    StripeAddonSeatsInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 0
          maximum: 500
    StripeAddonSeatsResponse:
      type: object
      required: [addonSeats, available, limitReached]
      properties:
        addonSeats:
          type: integer
        available:
          type: ["integer", "null"]
        limitReached:
          type: boolean
    SearchResults:
      type: object
      properties:
        tickets:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              ticketNumber:
                type: integer
                nullable: true
              title:
                type: string
              status:
                type: string
              priority:
                type: string
            required: [id, title, status, priority]
        clients:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              email:
                type: string
                nullable: true
            required: [id, name]
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              email:
                type: string
              role:
                type: string
            required: [id, name, email, role]
      required: [tickets, clients, users]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    AcquisitionStats:
      type: object
      properties:
        signupsByDay:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
              count:
                type: integer
            required: [date, count]
        bySource:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                nullable: true
              count:
                type: integer
            required: [source, count]
      required: [signupsByDay, bySource]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        mainLocation:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        isActive:
          type: boolean
        isAvailable:
          type: boolean
        hourlyCompensated:
          type: boolean
        createdAt:
          type: string
          format: date-time
        onboardingDone:
          type: boolean
          nullable: true
        businessType:
          type: string
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        stripeSubscriptionId:
          type: string
          nullable: true
        trialStatus:
          type: object
          nullable: true
          properties:
            isInTrial:
              type: boolean
            isExpired:
              type: boolean
            daysLeft:
              type: integer
          required:
            - isInTrial
            - isExpired
            - daysLeft
        isSuperAdmin:
          type: boolean
          nullable: true
        clientsEnabled:
          type: boolean
          nullable: true
        organizationId:
          type: integer
          nullable: true
        organizationName:
          type: string
          nullable: true
        groupPermissions:
          type: array
          items:
            type: string
            enum: [change_status, assign_time_tracked_tickets, add_notes, edit_fixed_notes, edit_client_notes, delete_client_notes, manage_client_sections, edit_client_section_content, create_appointments, view_worked_hours]
        inheritedGroupPermissions:
          type: array
          items:
            type: string
            enum: [change_status, assign_time_tracked_tickets, add_notes, edit_fixed_notes, edit_client_notes, delete_client_notes, manage_client_sections, edit_client_section_content, create_appointments, view_worked_hours]
        effectivePermissions:
          type: array
          items:
            type: string
            enum: [change_status, assign_time_tracked_tickets, add_notes, edit_fixed_notes, edit_client_notes, delete_client_notes, manage_client_sections, edit_client_section_content, create_appointments, view_worked_hours]
        permissionOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [inherit, grant, deny]
      required:
        - id
        - name
        - email
        - role
        - isActive
        - isAvailable
        - createdAt

    CreateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        mainLocation:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: string
          nullable: true
        hourlyCompensated:
          type: boolean
      required:
        - name
        - email
        - password
        - role

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [admin, user]
        mainLocation:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        groups:
          type: array
          items:
            type: string
          nullable: true
        isActive:
          type: boolean
        isAvailable:
          type: boolean
        hourlyCompensated:
          type: boolean
        permissionOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [inherit, grant, deny]

    RecurrenceRule:
      type: object
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          nullable: true
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
      required:
        - frequency

    CloneTicketBody:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
          nullable: true

    SetRecurrenceBody:
      type: object
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          nullable: true
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          nullable: true
        endDate:
          type: string
          format: date
          nullable: true
      required:
        - frequency

    Ticket:
      type: object
      properties:
        id:
          type: integer
        ticketNumber:
          type: integer
          nullable: true
        title:
          type: string
        description:
          type: string
        category:
          type: string
        location:
          type: string
        resource:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high, urgent]
        status:
          type: string
          enum: [open, waiting, resolved, closed]
        visibility:
          type: string
          enum: [organization, admins]
        createdBy:
          type: integer
        assignedTo:
          type: integer
          nullable: true
        inboundChannelId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        resolutionNote:
          type: string
          nullable: true
        workedMinutes:
          type: integer
          nullable: true
        workedBillingStatus:
          type: string
          enum: [unbilled, billed]
          nullable: true
        timeTrackingEnabled:
          type: boolean
        timeTrackingBillable:
          type: boolean
        timeTrackingCompensationOverride:
          type: boolean
          nullable: true
        clientId:
          type: integer
          nullable: true
        recurrenceRule:
          $ref: "#/components/schemas/RecurrenceRule"
          nullable: true
        recurrenceNextAt:
          type: string
          format: date-time
          nullable: true
        recurrenceParentId:
          type: integer
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - title
        - description
        - category
        - location
        - priority
        - status
        - visibility
        - createdBy
        - createdAt
        - updatedAt

    TicketWithDetails:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          properties:
            creator:
              $ref: "#/components/schemas/User"
            assignee:
              $ref: "#/components/schemas/User"
              nullable: true
            commentCount:
              type: integer
            noteCount:
              type: integer
            inboundChannelName:
              type: string
              nullable: true
            timeSessions:
              type: array
              items:
                $ref: "#/components/schemas/TicketTimeSession"
            timeTrackingSummary:
              $ref: "#/components/schemas/TicketTimeSummary"
            canChangeStatus:
              type: boolean
            canViewTimeTrackingSummary:
              type: boolean
          required:
            - creator
            - commentCount
            - noteCount

    TicketTimeSession:
      type: object
      required: [id, userId, userName, startedAt, endedAt, durationMinutes, clientBillable, collaboratorRecognizable]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        durationMinutes:
          type: integer
          minimum: 0
        clientBillable:
          type: boolean
        collaboratorRecognizable:
          type: boolean

    TicketTimeSummary:
      type: object
      required: [totalMinutes, clientBillableMinutes, collaboratorRecognizableMinutes, activeForCurrentUser]
      properties:
        totalMinutes:
          type: integer
        clientBillableMinutes:
          type: integer
        collaboratorRecognizableMinutes:
          type: integer
        activeForCurrentUser:
          type: boolean

    TimeTrackingReportRow:
      type: object
      required: [kind, ticketId, ticketNumber, title, date, durationMinutes, billingStatus, collaboratorInvoiceReceived]
      properties:
        kind:
          type: string
          enum: [session, manual]
        ticketId:
          type: integer
        ticketNumber:
          type: integer
          nullable: true
        title:
          type: string
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 0
        clientId:
          type: integer
          nullable: true
        clientName:
          type: string
          nullable: true
        collaboratorId:
          type: integer
          nullable: true
        collaboratorName:
          type: string
          nullable: true
        billingStatus:
          type: string
          enum: [unbilled, billed]
        collaboratorInvoiceReceived:
          type: ["boolean", "null"]

